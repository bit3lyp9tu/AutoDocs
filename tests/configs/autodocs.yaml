llm_service:
  api:
    base_url: 'https://llm.scads.ai/v1'
    # key_value: ''
    key_location: '~/.llm_key'
    request_delay_seconds: 3
  status:
    type: 'Chat'
    pre_check: true
    show_model_response_time: true
    show_model_status: true
    url: 'https://llm.scads.ai/status/state.json'
  alt_models:
    - 'google/gemma-4-31B-it'
autodocs:
  files_ignore_path: '.autodocs-ignore'
  model: MiniMaxAI/MiniMax-M3-MXFP8
  prompts:
    path: prompts/docs_summary.md
    header_path: prompts/docs_header.md
    footer_path: prompts/docs_footer.md
  plantuml:
    renderer_path: 'resources/plantuml.jar'
  valid_diagrams:
    umls: [
      "Sequence diagram",
      "Usecase diagram",
      "Class diagram",
      "Object diagram",
      "Activity diagram",
      "Component diagram",
      "Deployment diagram",
      "State diagram",
      "Timing diagram"
    ]
    non_umls: [
      "Network diagram (nwdiag)",
      "Wireframe graphical interface (Salt)",
      "Specification and Description Language (SDL)",
      "Ditaa diagram",
      "Gantt diagram",
      "MindMap diagram",
      "Work Breakdown Structure diagram",
      "Entity Relationship diagram"
    ]
  logs:
    llm_log:
      add_thinking_response: true
git:
  commit:
    allow_auto_msg: True
    sysprompt:
      file_path: 'prompts/commit-convention.md'
    vim_examination: True
    llm_model: 'google/gemma-4-31B-it'
    timeout: 180
